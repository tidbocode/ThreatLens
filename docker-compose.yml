services:
  threatlens:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - chroma_db:/app/chroma_db
    stdin_open: true
    tty: true

  dashboard:
    build: .
    env_file: .env
    entrypoint: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - chroma_db:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chroma_db:
